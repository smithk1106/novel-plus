server:
  session-timeout: 18000
  #    tomcat:
  #        max-threads: 1000
  #        min-spare-threads: 30
  port: 8088
#    uri-encoding: utf-8
#security:
#  basic:
#    enabled: false
spring:
  redis:
    #Redis服务器IP
    host: ${REDIS_HOST}
    #Redis服务器连接端口
    port: ${REDIS_PORT}
    #Redis服务器连接密码
    password: ${REDIS_PASSWORD}
    #连接超时时间（毫秒）
    timeout: 10000
  datasource:
    driverClassName: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:absolutepath:${user.dir}/config/shardingsphere-jdbc.yml
  thymeleaf:
    mode: LEGACYHTML5
    cache: false
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: dev
  
  #上传文件的最大值（100M）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  main:
    allow-bean-definition-overriding: true

mybatis:
  configuration:
    #自动将数据库带下划线的表字段值映射到Java类的驼峰字段上
    map-underscore-to-camel-case: true
  mapper-locations: mybatis/**/*Mapper.xml
  typeAliasesPackage: com.java2nb.**.domain

logging:
  config: classpath:logback-boot.xml
