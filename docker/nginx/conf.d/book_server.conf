map $http_upgrade $connection_upgrade { 
    default upgrade;
    ''      close;
}

server {
    server_name  book.wdllstudio.com;
    root         /usr/share/nginx/html/book_server;

    include /etc/nginx/conf.d/book_server_common.inc;
    location / {
        proxy_pass  http://localhost:8581/;

        auth_basic "WDLL Literature";
        auth_basic_user_file /etc/nginx/.htpasswd_wdll;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    http2        on;
    ssl_certificate /etc/letsencrypt/live/book.wdllstudio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/book.wdllstudio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = book.wdllstudio.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name  book.wdllstudio.com;
    return 404; # managed by Certbot
}

server {
    server_name  backend.wdllstudio.net;
    root         /usr/share/nginx/html/book_server;

    include /etc/nginx/conf.d/book_server_common.inc;
    location / {
        proxy_pass  http://localhost:8582/;

        auth_basic "WDLL Literature";
        auth_basic_user_file /etc/nginx/.htpasswd_wdll;
    }
}

server {
    server_name  crawler.wdllstudio.net;
    root         /usr/share/nginx/html/book_server;

    include /etc/nginx/conf.d/book_server_common.inc;

    location = /ws {
        proxy_pass http://localhost:8584/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10h;
        proxy_send_timeout 10h;
        proxy_read_timeout 10h;
    }

    location / {
        proxy_pass  http://localhost:8584/;

        auth_basic "WDLL Literature";
        auth_basic_user_file /etc/nginx/.htpasswd_wdll;
    }
}
